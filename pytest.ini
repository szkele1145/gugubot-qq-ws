[pytest]
# 只收集 tests/ 目录。
#
# 为什么必须限定：plugin/ 是插件源码目录，里面有 plugin/gugubot/connector/test_connector.py
# 这类文件（模块名以 test_ 开头，pytest 默认会当成测试文件收集）。它 import
# mcdreforged —— 而 mcdreforged 只在 MCDR 运行时环境里有，测试环境靠
# tests/ 里的 sys.meta_path stub 提供。于是从仓库根目录跑 pytest 时：
#   1) pytest 先收集 plugin/ 下的文件（早于 tests/）
#   2) import mcdreforged 失败 → ModuleNotFoundError
#   3) 收集阶段直接 Interrupted → **整轮测试一条都不跑**
#
# 之前一直用 `pytest tests/` 显式指定目录才没踩到，但任何人（包括 CI）
# 直接敲 `pytest` 就会中招。testpaths 是最省事的兜底。
testpaths = tests

# 独立脚本型测试（tests/test_*.py 里以 `if __name__ == "__main__"` 结尾的）
# 由 tests/test_standalone_scripts.py 用 subprocess 跑，不在 pytest 内重复执行。
python_files = test_*.py
